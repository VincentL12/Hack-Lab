<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; color: #222; }
  input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
  button { padding: 8px 16px; background: #1a5fb4; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
  .hint { font-size: 0.85em; color: #666; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Admin Login</h1>
  <div class="card">
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" name="username" autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>

    <form id="mfaForm" class="hidden">
      <label>MFA Code</label>
      <input type="text" id="code" name="code">
      <button type="submit">Verify</button>
    </form>
    <div class="hint" id="hint"></div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const mfaForm = document.getElementById('mfaForm');
    const hint = document.getElementById('hint');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.status === 200) {
        loginForm.classList.add('hidden');
        mfaForm.classList.remove('hidden');
        hint.textContent = data.hint || '';
      } else {
        hint.textContent = 'Login failed.';
      }
    });

    mfaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value;
      const res = await fetch('/api/verify-mfa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (res.status === 200 && data.redirect) {
        window.location.href = data.redirect;
      } else {
        hint.textContent = 'MFA verification failed.';
      }
    });
  </script>
</body>
</html>
